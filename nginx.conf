server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos (GeoJSON, assets)
    location /geojson/ {
        try_files $uri =404;
    }

    # Proxy /api → backend Cloud Run
    location /api/ {
        # VITE_API_URL se inyecta en build time via env.js
        # En runtime nginx redirige al backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass BACKEND_URL_PLACEHOLDER;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;  # clasificación puede tardar
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
